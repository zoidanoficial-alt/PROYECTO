[project]
name = "actuaryos"
version = "0.1.0"
description = "Flujo de trabajo actuarial integrado, explicable y auditable"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7"]

[project.scripts]
actuaryos = "actuaryos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["actuaryos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
