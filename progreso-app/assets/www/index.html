<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Mi Progreso</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #20242d;
    --line: #2b303b;
    --text: #f5f5f4;
    --muted: #9ca3af;
    --accent: #f97316;
    --accent-soft: rgba(249, 115, 22, .15);
    --good: #22c55e;
    --good-soft: rgba(34, 197, 94, .14);
    --warn: #eab308;
    --warn-soft: rgba(234, 179, 8, .14);
    --bad: #ef4444;
    --bad-soft: rgba(239, 68, 68, .14);
    --blue: #60a5fa;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { padding: 14px 16px; max-width: 640px; margin: 0 auto; }
  section.view { display: none; }
  section.view.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 650; }
  .card h2 small { color: var(--muted); font-weight: 400; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .big { font-size: 34px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

  .status { border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 14px; }
  .status b { display: block; margin-bottom: 2px; }
  .status.good { background: var(--good-soft); border: 1px solid rgba(34,197,94,.35); }
  .status.warn { background: var(--warn-soft); border: 1px solid rgba(234,179,8,.35); }
  .status.bad  { background: var(--bad-soft);  border: 1px solid rgba(239,68,68,.35); }
  .status.info { background: var(--surface-2); border: 1px solid var(--line); }

  .bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), #fb923c); border-radius: 99px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 99px; font-size: 13px;
    background: var(--surface-2); border: 1px solid var(--line);
  }
  .chip.ok { background: var(--good-soft); border-color: rgba(34,197,94,.4); }
  .chip.no { color: var(--muted); }

  canvas.chart { width: 100%; height: 190px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  label > input, label > select, label > textarea { margin-top: 4px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  .check { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; margin: 4px 0 12px; }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 12px; padding: 12px 16px;
    background: var(--accent); color: #111;
  }
  button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--bad-soft); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 8px; font-weight: 500; }
  button.block { width: 100%; }
  button:active { transform: scale(.98); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  tr.tap { cursor: pointer; }

  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; background: transparent; color: var(--muted); padding: 9px 6px; font-size: 14px; border-radius: 9px; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--line); }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    background: transparent; color: var(--muted); border-radius: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 2px 10px; font-size: 11px; font-weight: 500;
  }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }

  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .photo { position: relative; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: var(--surface-2); cursor: pointer; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo span {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 11px; padding: 14px 6px 5px;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
  }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .compare figure { margin: 0; }
  .compare img { width: 100%; border-radius: 10px; display: block; background: var(--surface-2); aspect-ratio: 3/4; object-fit: cover; }
  .compare figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

  details { border-bottom: 1px solid var(--line); }
  details:last-child { border-bottom: 0; }
  summary { padding: 12px 0; cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  summary::after { content: "+"; color: var(--muted); }
  details[open] summary::after { content: "–"; }
  details ul { margin: 0 0 12px; padding-left: 18px; }
  details li { margin: 3px 0; }
  details li em { color: var(--muted); font-style: normal; }

  .modal-bg {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); width: 100%; max-width: 640px;
    max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .modal h3 { margin: 0 0 12px; font-size: 17px; }
  .viewer img { width: 100%; border-radius: 12px; display: block; }

  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #fafaf9; color: #111; padding: 10px 14px; border-radius: 10px; font-size: 14px;
    z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1 id="hdr-title">Inicio</h1>
  <p id="hdr-sub"></p>
</header>

<main>
  <!-- INICIO -->
  <section class="view active" id="view-home"></section>
  <!-- DIARIO -->
  <section class="view" id="view-log"></section>
  <!-- FUERZA -->
  <section class="view" id="view-lifts"></section>
  <!-- FOTOS -->
  <section class="view" id="view-photos"></section>
  <!-- MÁS -->
  <section class="view" id="view-more"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    Inicio
  </button>
  <button data-tab="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    Diario
  </button>
  <button data-tab="lifts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M6 7v10M18 7v10M3 9v6M21 9v6"/></svg>
    Fuerza
  </button>
  <button data-tab="photos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>
    Fotos
  </button>
  <button data-tab="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    Más
  </button>
</nav>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ------------------------------------------------------------------ *
 *  Utilidades
 * ------------------------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = (n, d = 1) => n == null || !isFinite(n) ? '—' : n.toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (n, d = 1) => n == null ? '—' : (n > 0 ? '+' : '') + fmt(n, d);

function todayStr() { return dateStr(new Date()); }
function dateStr(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function shortDate(s) { const d = parseDate(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function longDate(s) { const d = parseDate(s); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ------------------------------------------------------------------ *
 *  Datos (localStorage) y fotos (IndexedDB)
 * ------------------------------------------------------------------ */
const KEY = 'miprogreso.v1';

function defaultData() {
  return {
    profile: {
      name: '',
      height: 180,
      age: 29,
      startWeight: 88,
      startDate: '2026-10-09',
      goalWeight: 81,
      phase: 'definicion',
      kcal: 2300,
      protein: 175,
      steps: 9000
    },
    // Peso inicial que diste el 9 de octubre de 2026.
    days: { '2026-10-09': { weight: 88 } },
    measures: [],
    lifts: []
  };
}

let DB;
function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      const def = defaultData();
      return {
        profile: Object.assign(def.profile, d.profile || {}),
        days: d.days || {},
        measures: d.measures || [],
        lifts: d.lifts || []
      };
    }
  } catch (e) { console.error(e); }
  return defaultData();
}
function saveData() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('No se pudo guardar: ' + e.message); }
}

const photoStore = (() => {
  let dbp;
  function open() {
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        const r = indexedDB.open('miprogreso-fotos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode);
      const store = t.objectStore('photos');
      const out = fn(store);
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    all: () => tx('readonly', s => s.getAll()).then(list => (list || []).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created || 0) - (a.created || 0))),
    put: p => tx('readwrite', s => s.put(p)),
    del: id => tx('readwrite', s => s.delete(id)),
    clear: () => tx('readwrite', s => s.clear())
  };
})();

/* ------------------------------------------------------------------ *
 *  Cálculos
 * ------------------------------------------------------------------ */
function weightEntries() {
  return Object.keys(DB.days)
    .filter(d => DB.days[d].weight != null)
    .sort()
    .map(d => ({ date: d, w: DB.days[d].weight }));
}

/** Promedio de peso en la ventana de 7 días que termina en `end` (incluido). */
function weekAvg(end) {
  const start = addDays(end, -6);
  const vals = weightEntries().filter(e => e.date >= start && e.date <= end).map(e => e.w);
  if (!vals.length) return null;
  return { avg: vals.reduce((a, b) => a + b, 0) / vals.length, n: vals.length };
}

function movingAvg(entries) {
  return entries.map(e => {
    const a = weekAvg(e.date);
    return { date: e.date, y: a ? a.avg : e.w };
  });
}

function currentWeight() {
  const today = todayStr();
  const w = weekAvg(today);
  if (w) return w.avg;
  const all = weightEntries();
  return all.length ? all[all.length - 1].w : null;
}

/**
 * Cambio semanal = promedio de esta semana menos el de la semana anterior.
 * Devuelve también el de hace dos semanas para detectar estancamientos.
 */
function weeklyRates() {
  const t = todayStr();
  const w0 = weekAvg(t), w1 = weekAvg(addDays(t, -7)), w2 = weekAvg(addDays(t, -14));
  return {
    w0, w1, w2,
    r1: w0 && w1 ? w0.avg - w1.avg : null,     // esta semana
    r2: w1 && w2 ? w1.avg - w2.avg : null      // semana pasada
  };
}

/** Consejo de ajuste según la fase y el ritmo (reglas del plan). */
function weightAdvice() {
  const p = DB.profile;
  const { r1, r2, w0 } = weeklyRates();
  if (r1 == null) {
    return { cls: 'info', title: 'Faltan datos', text: 'Pésate cada mañana en ayunas. Con 2 semanas de registros te digo si vas al ritmo correcto.' };
  }
  const pctWeek = w0 ? (r1 / w0.avg) * 100 : 0;
  if (p.phase === 'definicion') {
    const loss = -r1, prevLoss = r2 == null ? null : -r2;
    if (loss > 1.0) return { cls: 'bad', title: 'Bajas demasiado rápido', text: `Perdiste ${fmt(loss)} kg esta semana. Por encima de 1 kg/sem arriesgas músculo: suma ~150 kcal (sobre todo carbohidratos).` };
    if (loss < 0.4 && prevLoss != null && prevLoss < 0.4) return { cls: 'warn', title: '2 semanas por debajo del ritmo', text: 'Quita 150–200 kcal (de carbohidratos) o suma ~2,000 pasos diarios.' };
    if (loss < 0.4) return { cls: 'warn', title: 'Semana lenta', text: `Bajaste ${fmt(loss)} kg (${fmt(-pctWeek)} %). Si la próxima semana se repite, toca ajustar. No cambies nada aún.` };
    return { cls: 'good', title: 'Vas bien', text: `Bajaste ${fmt(loss)} kg esta semana (${fmt(-pctWeek)} % de tu peso). El ritmo ideal es 0.5–0.8 kg/sem.` };
  }
  if (p.phase === 'volumen') {
    if (r1 > 0.25) return { cls: 'warn', title: 'Subes rápido', text: `Ganaste ${fmt(r1)} kg esta semana. Para que sea músculo y no grasa, quita ~150 kcal (meta: 0.25–0.5 kg al mes).` };
    if (r1 < 0 && r2 != null && r2 < 0) return { cls: 'warn', title: 'No estás subiendo', text: 'Dos semanas bajando de peso en fase de volumen: suma ~150 kcal.' };
    return { cls: 'good', title: 'Vas bien', text: `Cambio esta semana: ${signed(r1)} kg. Meta: subir 0.25–0.5 kg al mes.` };
  }
  if (Math.abs(r1) > 0.4) return { cls: 'warn', title: 'Te estás moviendo del mantenimiento', text: `Cambio esta semana: ${signed(r1)} kg. Ajusta ±150 kcal.` };
  return { cls: 'good', title: 'Manteniendo', text: `Cambio esta semana: ${signed(r1)} kg.` };
}

/** Estimación de cuándo llegas al objetivo con el ritmo de las últimas 2–4 semanas. */
function projection() {
  const p = DB.profile, cur = currentWeight();
  if (cur == null) return null;
  const t = todayStr();
  const now = weekAvg(t), p3 = weekAvg(addDays(t, -21)), past = p3 || weekAvg(addDays(t, -14));
  if (!now || !past) return null;
  const weeks = p3 ? 3 : 2;
  const rate = (now.avg - past.avg) / weeks;            // kg por semana
  const remaining = p.goalWeight - cur;
  if (Math.abs(remaining) < 0.2) return { done: true };
  if (rate === 0 || Math.sign(rate) !== Math.sign(remaining)) return { stalled: true, rate };
  const wks = remaining / rate;
  return { weeks: wks, date: addDays(t, Math.round(wks * 7)), rate };
}

const e1rm = (w, r) => w * (1 + r / 30);

const EXERCISES = [
  'Press banca (barra)', 'Press banca (mancuernas)', 'Press banca (Smith)', 'Press inclinado (mancuernas)',
  'Sentadilla (Smith)', 'Prensa', 'Peso muerto rumano', 'Hip thrust',
  'Remo con mancuerna', 'Remo en polea', 'Jalón al pecho', 'Dominadas',
  'Press militar (mancuernas)', 'Elevaciones laterales', 'Curl de bíceps', 'Extensión de tríceps'
];

function liftNames() {
  const used = Array.from(new Set(DB.lifts.map(l => l.ex)));
  return Array.from(new Set(used.concat(EXERCISES)));
}

/** Mejor 1RM estimado por semana (0 = últimos 7 días). */
function weeklyBest(ex, weeksBack) {
  const t = todayStr();
  const out = [];
  for (let i = 0; i < weeksBack; i++) {
    const end = addDays(t, -7 * i), start = addDays(end, -6);
    const sets = DB.lifts.filter(l => l.ex === ex && l.date >= start && l.date <= end);
    out.push(sets.length ? Math.max(...sets.map(l => e1rm(l.w, l.r))) : null);
  }
  return out;
}

/** Ejercicios cuya fuerza ha bajado 2 semanas seguidas. */
function strengthAlerts() {
  const exs = Array.from(new Set(DB.lifts.map(l => l.ex)));
  return exs.filter(ex => {
    const [w0, w1, w2] = weeklyBest(ex, 3);
    return w0 != null && w1 != null && w2 != null && w0 < w1 && w1 < w2;
  });
}

/* ------------------------------------------------------------------ *
 *  Gráficas (canvas, sin librerías)
 * ------------------------------------------------------------------ */
function drawChart(canvas, opts) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const css = getComputedStyle(document.documentElement);
  const cMuted = css.getPropertyValue('--muted').trim();
  const cLine = css.getPropertyValue('--line').trim();

  const pts = opts.series.flatMap(s => s.points);
  const hl = opts.hlines || [];
  if (!pts.length) {
    ctx.fillStyle = cMuted; ctx.font = '13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('Sin datos todavía', W / 2, H / 2);
    return;
  }
  const xs = pts.map(p => parseDate(p.date).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
  let ys = pts.map(p => p.y).concat(hl.map(h => h.y));
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = Math.max((y1 - y0) * 0.12, opts.minPad || 0.5);
  y0 -= padY; y1 += padY;

  const L = 38, R = 10, T = 10, B = 22;
  const px = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const py = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);

  // Rejilla y eje Y
  ctx.font = '11px system-ui';
  ctx.fillStyle = cMuted; ctx.strokeStyle = cLine; ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) {
    const v = y0 + (y1 - y0) * i / 3, y = py(v);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.fillText(v.toFixed(opts.yDec == null ? 1 : opts.yDec), L - 6, y);
  }
  // Eje X: primera y última fecha
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.fillText(shortDate(dateStr(new Date(x0))), L, H - 5);
  ctx.textAlign = 'right'; ctx.fillText(shortDate(dateStr(new Date(x1))), W - R, H - 5);

  // Líneas horizontales (objetivo)
  hl.forEach(h => {
    const y = py(h.y);
    ctx.save();
    ctx.setLineDash([5, 4]); ctx.strokeStyle = h.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.restore();
    if (h.label) { ctx.fillStyle = h.color; ctx.textAlign = 'right'; ctx.fillText(h.label, W - R - 2, y - 5); }
  });

  // Series
  opts.series.forEach(s => {
    const p = s.points.map(q => [px(parseDate(q.date).getTime()), py(q.y)]);
    if (s.line !== false && p.length > 1) {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 2.5; ctx.lineJoin = 'round';
      ctx.beginPath(); p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    }
    if (s.dots) {
      ctx.fillStyle = s.color;
      p.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, s.r || 2.5, 0, Math.PI * 2); ctx.fill(); });
    }
  });
}

const TITLES = { home: 'Inicio', log: 'Diario', lifts: 'Fuerza', photos: 'Fotos', more: 'Más' };
let currentTab = 'home';

function showTab(tab) {
  currentTab = tab;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('section.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + tab));
  $('#hdr-title').textContent = TITLES[tab];
  render(tab);
  window.scrollTo(0, 0);
}

function render(tab) {
  ({ home: renderHome, log: renderLog, lifts: renderLifts, photos: renderPhotos, more: renderMore })[tab]();
  const p = DB.profile;
  $('#hdr-sub').textContent = (p.name ? p.name + ' · ' : '') + longDate(todayStr());
}

function openModal(html, onMount) {
  $('#modal').innerHTML = html;
  $('#modal-bg').classList.add('open');
  if (onMount) onMount($('#modal'));
}
function closeModal() { $('#modal-bg').classList.remove('open'); $('#modal').innerHTML = ''; }
$('#modal-bg').addEventListener('click', e => { if (e.target.id === 'modal-bg') closeModal(); });

window.onAndroidBack = function () {
  if ($('#modal-bg').classList.contains('open')) { closeModal(); return true; }
  if (currentTab !== 'home') { showTab('home'); return true; }
  return false;
};

$('#tabs').addEventListener('click', e => {

});

    };
    $('#f-date', m).onchange = ev => { if (ev.target.value) openDayForm(ev.target.value); };
    $('#f-save', m).onclick = () => {
      const d = $('#f-date', m).value || date;
      const rec = {
        weight: num($('#f-weight', m).value),

        kcal: num($('#f-kcal', m).value),
        protein: num($('#f-protein', m).value),
        sleep: num($('#f-sleep', m).value),
        trained: $('#f-trained', m).checked,
        note: $('#f-note', m).value.trim()
      };

      if (Object.keys(rec).length) DB.days[d] = rec; else delete DB.days[d];
      saveData(); closeModal(); render(currentTab); toast('Guardado');

let liftSel = null;

function renderLifts() {
  const used = Array.from(new Set(DB.lifts.map(l => l.ex)));
  if (!liftSel || !used.includes(liftSel)) liftSel = used[0] || null;
  const alerts = strengthAlerts();

  const sets = liftSel ? DB.lifts.filter(l => l.ex === liftSel).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.t || 0) - (a.t || 0)) : [];
  // Mejor 1RM estimado por día para la gráfica
  const byDay = {};
  sets.forEach(s => { const v = e1rm(s.w, s.r); if (!byDay[s.date] || v > byDay[s.date]) byDay[s.date] = v; });
  const pts = Object.keys(byDay).sort().map(d => ({ date: d, y: byDay[d] }));
  const best = sets.length ? sets.reduce((a, b) => e1rm(b.w, b.r) > e1rm(a.w, a.r) ? b : a) : null;
  const [w0, w1] = liftSel ? weeklyBest(liftSel, 2) : [null, null];

  $('#view-lifts').innerHTML = `
    <button class="block" id="lift-add">+ Registrar serie</button>
    ${alerts.length ? `<div class="status warn"><b>Fuerza a la baja</b>${esc(alerts.join(', '))} lleva 2 semanas bajando. Revisa sueño, proteína y calorías.</div>` : ''}
    ${used.length ? `
    <div class="card" style="margin-top:12px">
      <label style="margin-bottom:12px">Ejercicio
        <select id="lift-sel">${used.map(n => `<option ${n === liftSel ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      </label>
      <div class="grid3" style="margin-bottom:12px">
        <div class="stat"><div class="label">Mejor serie</div><div class="value" style="font-size:16px">${best ? fmt(best.w, best.w % 1 ? 1 : 0) + '×' + best.r : '—'}</div></div>
        <div class="stat"><div class="label">1RM estimado</div><div class="value" style="font-size:16px">${best ? fmt(e1rm(best.w, best.r), 0) + ' kg' : '—'}</div></div>
        <div class="stat"><div class="label">vs. sem. pasada</div><div class="value" style="font-size:16px;color:${w0 != null && w1 != null ? (w0 >= w1 ? 'var(--good)' : 'var(--warn)') : 'var(--muted)'}">${w0 != null && w1 != null ? signed(w0 - w1, 1) : '—'}</div></div>
      </div>
      <canvas class="chart" id="lift-chart"></canvas>
      <div class="legend"><span><i style="background:var(--accent)"></i>1RM estimado (mejor serie del día)</span></div>
    </div>
    <div class="card">
      <h2>Series</h2>
      <table><thead><tr><th>Día</th><th class="num">Peso</th><th class="num">Reps</th><th class="num">1RM est.</th><th></th></tr></thead>
      <tbody>${sets.slice(0, 40).map(s => `<tr>
        <td>${shortDate(s.date)}</td><td class="num">${fmt(s.w, s.w % 1 ? 1 : 0)}</td><td class="num">${s.r}</td>
        <td class="num">${fmt(e1rm(s.w, s.r), 0)}</td>
        <td class="num"><button class="ghost" data-del="${s.id}">✕</button></td></tr>`).join('')}</tbody></table>
    </div>` : `<div class="card" style="margin-top:12px"><div class="empty">Registra tus series principales (press, sentadilla, remo, jalón, press militar).<br>Si mantienes o subes tus pesos mientras bajas de peso, estás conservando el músculo.</div></div>`}
  `;
  $('#lift-add').onclick = () => openLiftForm();
  const sel = $('#lift-sel');
  if (sel) sel.onchange = () => { liftSel = sel.value; renderLifts(); };
  $$('#view-lifts [data-del]').forEach(b => b.onclick = () => {
    if (!confirm('¿Borrar esta serie?')) return;
    DB.lifts = DB.lifts.filter(l => l.id !== b.dataset.del); saveData(); renderLifts();
  });
  if (pts.length) requestAnimationFrame(() => drawChart($('#lift-chart'), {
    series: [{ points: pts, color: getVar('--accent'), dots: true, r: 3.5 }], yDec: 0, minPad: 2
  }));
}

      <label>Repeticiones<input id="l-r" inputmode="numeric" value="${last ? last.r : ''}"></label>
    </div>
    <label>Fecha<input type="date" id="l-date" value="${todayStr()}" max="${todayStr()}"></label>
    <p class="small muted" style="margin-top:0">Apunta tu mejor serie de trabajo (no el calentamiento). Puedes registrar varias.</p>
    <div class="row">
      <button class="secondary" id="l-cancel" style="flex:1">Cerrar</button>
      <button id="l-save" style="flex:1">Guardar serie</button>
    </div>`, m => {
    const ex = $('#l-ex', m);
    ex.onchange = () => { $('#l-other-wrap', m).style.display = ex.value === '__otro' ? 'block' : 'none'; };
    $('#l-cancel', m).onclick = () => { closeModal(); renderLifts(); };
    $('#l-save', m).onclick = () => {
      const name = ex.value === '__otro' ? $('#l-other', m).value.trim() : ex.value;
      const w = num($('#l-w', m).value), r = num($('#l-r', m).value);
      if (!name) { toast('Escribe el ejercicio'); return; }
      if (w == null || w < 0 || r == null || r < 1 || r > 50) { toast('Revisa peso y repeticiones'); return; }
      DB.lifts.push({ id: uid(), ex: name, w, r: Math.round(r), date: $('#l-date', m).value || todayStr(), t: Date.now() });
      liftSel = name;
      saveData();
      toast('Serie guardada: ' + name + ' ' + fmt(w, w % 1 ? 1 : 0) + '×' + Math.round(r));
    };
  });
}

/* ------------------------------------------------------------------ *
 *  FOTOS
 * ------------------------------------------------------------------ */
const POSES = { frente: 'Frente', lado: 'Lado', espalda: 'Espalda', objetivo: 'Objetivo' };
let photoCache = [];
let cmpA = null, cmpB = null;

async function renderPhotos() {
  const v = $('#view-photos');
  v.innerHTML = '<div class="empty">Cargando fotos…</div>';
  try { photoCache = await photoStore.all(); }
  catch (e) { v.innerHTML = '<div class="empty">No se pudieron abrir las fotos: ' + esc(e.message) + '</div>'; return; }

  const list = photoCache;
  const byPose = pose => list.filter(p => p.pose === pose);
  // Comparación por defecto: primera vs última foto de frente (o la foto objetivo).
  if (!list.find(p => p.id === cmpA)) cmpA = null;
  if (!list.find(p => p.id === cmpB)) cmpB = null;
  if (!cmpA || !cmpB) {
    const fr = byPose('frente');
    if (fr.length >= 2) { cmpA = fr[fr.length - 1].id; cmpB = fr[0].id; }
    else if (list.length >= 2) { cmpA = list[list.length - 1].id; cmpB = list[0].id; }
  }
  const opt = sel => list.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${shortDate(p.date)} · ${POSES[p.pose] || p.pose}</option>`).join('');
  const A = list.find(p => p.id === cmpA), B = list.find(p => p.id === cmpB);
  const gap = A && B ? Math.abs(daysBetween(A.date, B.date)) : 0;

  v.innerHTML = `
    <button class="block" id="ph-add">+ Añadir foto</button>
    <p class="small muted">Misma luz, mismo sitio, misma hora y misma postura cada 4 semanas. Así ves el cambio real y no el de la iluminación.</p>
    ${list.length >= 2 ? `
    <div class="card">
      <h2>Comparar ${gap ? `<small>· ${gap} días de diferencia</small>` : ''}</h2>
      <div class="grid2" style="margin-bottom:8px">
        <select id="cmp-a">${opt(cmpA)}</select>
        <select id="cmp-b">${opt(cmpB)}</select>
      </div>
      <div class="compare">
        <figure><img src="${A ? A.data : ''}" alt=""><figcaption>${A ? longDate(A.date) : ''}</figcaption></figure>
        <figure><img src="${B ? B.data : ''}" alt=""><figcaption>${B ? longDate(B.date) : ''}</figcaption></figure>
      </div>
    </div>` : ''}
    <div class="card">
      <h2>Galería <small>· ${list.length} foto${list.length === 1 ? '' : 's'}</small></h2>
      ${list.length ? `<div class="photos">${list.map(p => `
        <div class="photo" data-id="${p.id}"><img src="${p.data}" alt="" loading="lazy"><span>${shortDate(p.date)} · ${POSES[p.pose] || esc(p.pose)}</span></div>`).join('')}</div>`
        : '<div class="empty">Sube tus fotos de hoy (frente, lado y espalda) y tu foto objetivo.</div>'}
    </div>`;

  $('#ph-add').onclick = openPhotoForm;
  const a = $('#cmp-a'), b = $('#cmp-b');
  if (a) { a.onchange = () => { cmpA = a.value; renderPhotos(); }; b.onchange = () => { cmpB = b.value; renderPhotos(); }; }
  $$('#view-photos .photo').forEach(el => el.onclick = () => openPhotoViewer(el.dataset.id));
}

function openPhotoForm() {
  openModal(`
    <h3>Añadir foto</h3>
    <label>Foto<input type="file" id="p-file" accept="image/*"></label>
    <img id="p-prev" style="display:none;width:100%;border-radius:12px;margin-bottom:10px" alt="">
    <div class="grid2">
      <label>Postura<select id="p-pose">${Object.keys(POSES).map(k => `<option value="${k}">${POSES[k]}</option>`).join('')}</select></label>
      <label>Fecha<input type="date" id="p-date" value="${todayStr()}"></label>
    </div>
    <div class="row">
      <button class="secondary" id="p-cancel" style="flex:1">Cancelar</button>
      <button id="p-save" style="flex:1" disabled>Guardar</button>
    </div>`, m => {
    let dataUrl = null;
    $('#p-cancel', m).onclick = closeModal;
    $('#p-file', m).onchange = async ev => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      try {
        dataUrl = await shrinkImage(f, 1280, 0.82);
        const prev = $('#p-prev', m); prev.src = dataUrl; prev.style.display = 'block';
        $('#p-save', m).disabled = false;
      } catch (e) { toast('No se pudo leer la imagen'); }
    };
    $('#p-save', m).onclick = async () => {
      if (!dataUrl) return;
      $('#p-save', m).disabled = true;
      try {
        await photoStore.put({ id: uid(), date: $('#p-date', m).value || todayStr(), pose: $('#p-pose', m).value, data: dataUrl, created: Date.now() });
        closeModal(); toast('Foto guardada'); renderPhotos();
      } catch (e) { toast('Error al guardar: ' + e.message); $('#p-save', m).disabled = false; }
    };
  });
}

function openPhotoViewer(id) {
  const p = photoCache.find(x => x.id === id);
  if (!p) return;
  openModal(`
    <div class="viewer">
      <div class="row spread" style="margin-bottom:10px">
        <h3 style="margin:0">${longDate(p.date)} · ${POSES[p.pose] || esc(p.pose)}</h3>
        <button class="ghost" id="v-close">Cerrar</button>
      </div>
      <img src="${p.data}" alt="">
      <div class="row" style="margin-top:12px">
        <button class="danger" id="v-del" style="flex:1">Borrar foto</button>
      </div>
    </div>`, m => {
    $('#v-close', m).onclick = closeModal;
    $('#v-del', m).onclick = async () => {
      if (!confirm('¿Borrar esta foto?')) return;
      await photoStore.del(id); closeModal(); toast('Foto borrada'); renderPhotos();
    };
  });
}

/** Reduce la imagen para que no llene el almacenamiento (y respeta la orientación EXIF). */
function shrinkImage(file, maxSide, quality) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen')); };
    img.src = url;
  });
}

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */

  { day: 'Lunes · Torso A (fuerza)', items: [

    ['Elevaciones laterales', '3 × 12–15'], ['Curl de bíceps con mancuernas', '2 × 10–12'], ['Extensión de tríceps en polea', '2 × 10–12']] },
  { day: 'Martes · Pierna A', items: [
    ['Sentadilla en Smith o prensa', '4 × 6–8'], ['Peso muerto rumano con mancuernas', '3 × 8–10'],
    ['Zancadas o split squat búlgaro', '3 × 10 por pierna'], ['Curl femoral en máquina', '3 × 10–12'], ['Gemelos de pie', '3 × 12–15']] },
  { day: 'Jueves · Torso B (volumen)', items: [

function renderMore() {
  const p = DB.profile;
  $('#view-more').innerHTML = `
    <div class="card">
      <h2>Perfil y objetivos</h2>
      <div class="grid2">
        <label>Nombre<input id="pr-name" value="${esc(p.name)}" placeholder="Opcional"></label>
        <label>Fase<select id="pr-phase">
          <option value="definicion" ${p.phase === 'definicion' ? 'selected' : ''}>Definición</option>
          <option value="volumen" ${p.phase === 'volumen' ? 'selected' : ''}>Volumen limpio</option>
          <option value="mantener" ${p.phase === 'mantener' ? 'selected' : ''}>Mantener</option>
        </select></label>
        <label>Altura (cm)<input id="pr-height" inputmode="numeric" value="${p.height}"></label>
        <label>Edad<input id="pr-age" inputmode="numeric" value="${p.age}"></label>
        <label>Peso inicial (kg)<input id="pr-start" inputmode="decimal" value="${p.startWeight}"></label>
        <label>Fecha de inicio<input type="date" id="pr-sdate" value="${p.startDate}"></label>
        <label>Peso objetivo (kg)<input id="pr-goal" inputmode="decimal" value="${p.goalWeight}"></label>
        <label>Pasos diarios<input id="pr-steps" inputmode="numeric" value="${p.steps}"></label>
        <label>Calorías diarias<input id="pr-kcal" inputmode="numeric" value="${p.kcal}"></label>
        <label>Proteína diaria (g)<input id="pr-protein" inputmode="numeric" value="${p.protein}"></label>
      </div>
      <button class="block" id="pr-save">Guardar perfil</button>
    </div>

    <div class="card">
      <h2>Tu plan</h2>
      <ul class="small" style="margin:0;padding-left:18px">
        <li><b>${p.kcal} kcal</b> y <b>${p.protein} g de proteína</b> al día (proteína: la cifra que más importa).</li>
        <li>Grasas ~70 g y el resto en carbohidratos, sobre todo antes y después de entrenar.</li>
        <li>${p.steps.toLocaleString('es-MX')} pasos al día; cardio intenso máx. 1–2 veces por semana.</li>
        <li>Pesado siempre: no bajes los pesos para "definir".</li>
        <li>Duerme 7–8 h. Creatina 3–5 g/día (opcional).</li>
        <li>Ritmo ideal en definición: 0.5–0.8 kg por semana.</li>
      </ul>
    </div>

    <div class="card">
      <h2>Rutina <small>· 4–5 días, deja 1–2 reps en reserva</small></h2>
      ${ROUTINE.map(d => `<details><summary>${esc(d.day)}</summary><ul>${d.items.map(i => `<li>${esc(i[0])} <em>· ${esc(i[1])}</em></li>`).join('')}</ul></details>`).join('')}
      <p class="small muted" style="margin:10px 0 0">Cuando llegues al tope de repeticiones en todas las series, sube el peso (2–2.5 kg en mancuernas, 5 kg en máquina). Descanso: 2–3 min en básicos, 60–90 s en accesorios.</p>
    </div>

    <div class="card">
      <h2>Copia de seguridad</h2>
      <p class="small muted" style="margin-top:0">Los datos se guardan solo en este teléfono. Exporta una copia de vez en cuando (y siempre antes de reinstalar la app).</p>
      <div class="grid2">
        <button class="secondary" id="bk-export">Exportar</button>
        <button class="secondary" id="bk-import">Importar</button>
      </div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="bk-photos" checked> Incluir fotos en la copia</label>
      <input type="file" id="bk-file" accept=".json,application/json" style="display:none">
    </div>

    <div class="card">
      <h2>Zona peligrosa</h2>
      <button class="danger block" id="reset">Borrar todos los datos</button>
    </div>
    <p class="small muted" style="text-align:center">Mi Progreso 1.0 · tus datos no salen del teléfono</p>`;

  $('#pr-save').onclick = () => {
    const g = id => num($(id).value);
    const np = {
      name: $('#pr-name').value.trim(), phase: $('#pr-phase').value,
      height: g('#pr-height'), age: g('#pr-age'), startWeight: g('#pr-start'),
      startDate: $('#pr-sdate').value || p.startDate, goalWeight: g('#pr-goal'),
      steps: g('#pr-steps'), kcal: g('#pr-kcal'), protein: g('#pr-protein')
    };
    for (const k of ['height', 'age', 'startWeight', 'goalWeight', 'steps', 'kcal', 'protein']) {
      if (np[k] == null || np[k] <= 0) { toast('Revisa el campo: ' + k); return; }
    }
    DB.profile = Object.assign(DB.profile, np);
    saveData(); toast('Perfil guardado'); render('more');
  };
  $('#bk-export').onclick = exportBackup;
  $('#bk-import').onclick = () => $('#bk-file').click();
  $('#bk-file').onchange = importBackup;
  $('#reset').onclick = async () => {
    if (!confirm('Esto borra pesos, medidas, series y fotos. ¿Seguro?')) return;
    if (!confirm('Última confirmación: no se puede deshacer.')) return;
    DB = defaultData(); DB.days = {}; saveData();
    try { await photoStore.clear(); } catch (e) {}
    toast('Datos borrados'); showTab('home');
  };
}

async function exportBackup() {
  const withPhotos = $('#bk-photos').checked;
  const payload = { app: 'miprogreso', version: 1, exportedAt: new Date().toISOString(), data: DB };
  if (withPhotos) payload.photos = await photoStore.all();
  const json = JSON.stringify(payload);
  const name = 'miprogreso-' + todayStr() + '.json';
  if (window.AndroidBridge && AndroidBridge.saveFile) {
    const where = AndroidBridge.saveFile(name, json);
    if (!where) toast('No se pudo guardar la copia');
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Copia descargada');
}

function importBackup(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const obj = JSON.parse(r.result);
      if (obj.app !== 'miprogreso' || !obj.data) throw new Error('No es una copia de Mi Progreso');
      const nPhotos = (obj.photos || []).length;
      if (!confirm(`Copia del ${obj.exportedAt ? obj.exportedAt.slice(0, 10) : '?'}: ${Object.keys(obj.data.days || {}).length} días, ${(obj.data.lifts || []).length} series, ${nPhotos} fotos.\n\nReemplazará los datos actuales. ¿Continuar?`)) return;
      localStorage.setItem(KEY, JSON.stringify(obj.data));
      DB = loadData();
      if (obj.photos) {
        await photoStore.clear();
        for (const p of obj.photos) await photoStore.put(p);
      }
      toast('Copia restaurada'); showTab('home');
    } catch (e) { toast('Error: ' + e.message); }
  };
  r.readAsText(f);
}

/* ------------------------------------------------------------------ *
 *  Arranque
 * ------------------------------------------------------------------ */
DB = loadData();
if (!localStorage.getItem(KEY)) saveData();
showTab('home');
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (currentTab !== 'photos') render(currentTab); }, 150);
});
</script>
