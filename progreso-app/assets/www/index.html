<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111c23">
<title>Mi Progreso</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <img class="hdr-logo" src="img/logo.png" alt="">
  <div class="hdr-text">
    <h1 id="hdr-title">Inicio</h1>
    <p id="hdr-sub"></p>
  </div>
  <button class="hdr-ella" id="hdr-ella" hidden aria-pressed="false"><span>Modo Ella</span></button>
</header>

<main>
  <section class="view active" id="view-home"></section>
  <section class="view" id="view-train"></section>
  <section class="view" id="view-food"></section>
  <section class="view" id="view-progress"></section>
  <section class="view" id="view-more"></section>
</main>

<div class="timer-bar" id="timer-bar">
  <span class="t" id="tb-time">0:00</span>
  <span class="lbl" id="tb-label">Descanso</span>
  <button id="tb-repeat" hidden>＋ Igual</button>
  <button class="secondary" id="tb-minus">−15</button>
  <button class="secondary" id="tb-plus">+15</button>
  <button class="ghost" id="tb-stop">✕</button>
</div>

<button class="fab" id="fab" aria-label="Registrar">+</button>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    Hoy
  </button>
  <button data-tab="train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M6 7v10M18 7v10M3 9v6M21 9v6"/></svg>
    Plan
  </button>
  <button data-tab="food">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
    Nutrición
  </button>
  <button data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
    Progreso
  </button>
  <button data-tab="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    Explorar
  </button>
</nav>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="ella.js"></script>
<script src="pecho.js"></script>
<script src="coach.js"></script>
<script src="journey.js"></script>
<script src="cycle.js"></script>
<script src="strength.js"></script>
<script src="running.js"></script>
<script src="treadmill.js"></script>
<script src="runplan.js"></script>
<script src="missions.js"></script>
<script src="pf.js"></script>
<script src="retos.js"></script>
<script src="notif.js"></script>
<script src="ruta.js"></script>
<script src="facil.js"></script>
<script src="decide.js"></script>
<script src="compite.js"></script>
<script src="kit.js"></script>
<script src="app.js"></script>
<script src="export.js"></script>
</body>
</html>
