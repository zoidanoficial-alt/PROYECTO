name: App Android

on:
  push:
    branches: [gh-pages]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TiempoDeGracia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TiempoDeGracia-apk
          path: TiempoDeGracia.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android TiempoDeGracia.apk \
            --target "$GITHUB_SHA" \
            --title "App Android de Tiempo de Gracia (versión ${{ github.run_number }})" \
            --notes "Descarga TiempoDeGracia.apk en tu celular Android e instálalo. Android te pedirá permitir instalar apps de esta fuente."
