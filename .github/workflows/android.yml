name: App Android

on:
  push:
    branches: [gh-pages]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Firma fija: las versiones nuevas se instalan encima de las anteriores
            printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/firma.p12"
            export KEYSTORE_FILE="$RUNNER_TEMP/firma.p12"
            gradle -p android assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk TiempoDeGracia.apk
            rm -f "$RUNNER_TEMP/firma.p12"
          else
            echo "::warning::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD; se usa una firma de prueba."
            gradle -p android assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk TiempoDeGracia.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TiempoDeGracia-apk
          path: TiempoDeGracia.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android TiempoDeGracia.apk \
            --target "$GITHUB_SHA" \
            --title "App Android de Tiempo de Gracia (versión ${{ github.run_number }})" \
            --notes "Descarga TiempoDeGracia.apk en tu celular Android e instálalo. Android te pedirá permitir instalar apps de esta fuente."
