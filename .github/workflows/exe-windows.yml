name: Compilar CIFRAS.exe

on:
  push:
    branches: ["claude/optimistic-albattani-4uvfwm", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # para publicar el .exe como Release al crear una etiqueta v*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl jinja2 streamlit anthropic pywebview pyinstaller pytest

      - name: Pruebas del analista
        run: python -m pytest -q tests/test_analista_datos.py tests/test_analista_analisis.py tests/test_analista_salidas.py tests/test_analista_consultoria.py

      - name: Compilar el ejecutable
        run: pyinstaller --noconfirm empaquetado/CIFRAS.spec

      # CIFRAS.exe es una app de ventana (sin consola): se espera a que termine y se lee su registro.
      - name: Verificar que el .exe funciona
        shell: pwsh
        run: |
          $p = Start-Process dist\CIFRAS.exe -ArgumentList "--prueba" -Wait -PassThru
          Get-Content "$env:USERPROFILE\Documents\CIFRAS Consultores\registro.log" -Tail 5
          if ($p.ExitCode -ne 0) { throw "CIFRAS.exe --prueba terminó con código $($p.ExitCode)" }

      - name: Verificar la ventana de escritorio
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process dist\CIFRAS.exe -ArgumentList "--prueba-ventana" -Wait -PassThru
          Get-Content "$env:USERPROFILE\Documents\CIFRAS Consultores\registro.log" -Tail 25
          if ($p.ExitCode -ne 0) { throw "La ventana no cargó la aplicación (código $($p.ExitCode))" }

      - name: Preparar paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paquete | Out-Null
          Copy-Item dist\CIFRAS.exe paquete\
          Copy-Item empaquetado\LEEME.txt paquete\
          python -c "from analista_financiero.demo import generar_excel; generar_excel('paquete/Ejemplo - Cafe La Montana.xlsx')"
          python -c "from analista_financiero.plantilla import generar_plantilla; generar_plantilla('paquete/Plantilla para clientes.xlsx')"
          Compress-Archive -Path paquete\* -DestinationPath CIFRAS-Consultores-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CIFRAS-Consultores-windows
          path: CIFRAS-Consultores-windows.zip
          retention-days: 30

      - name: Leer versión
        id: version
        shell: bash
        run: echo "v=$(python -c 'import analista_financiero as a; print(a.__version__)')" >> "$GITHUB_OUTPUT"

      # Publica (o actualiza) la Release "v<versión>": enlace de descarga permanente.
      # Para sacar una versión nueva basta con subir __version__ en analista_financiero/__init__.py.
      - name: Publicar Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: CIFRAS Consultores ${{ steps.version.outputs.v }}
          body: |
            Descarga **CIFRAS-Consultores-windows.zip**, descomprímelo y abre `CIFRAS.exe`.
            Incluye la guía `LEEME.txt`, la plantilla de Excel para clientes y un archivo de ejemplo.
          files: CIFRAS-Consultores-windows.zip
          make_latest: true
